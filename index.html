<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ключи24 — посуточная аренда квартир · Академический и Вторчермет</title>
<meta name="description" content="Прототип сервиса посуточной аренды квартир в Екатеринбурге: районы Академический и Вторчермет. Демонстрационный интерфейс без привязки к живым сервисам.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink-2:#3A3F47; --ink-3:#61666F;
  --paper:#EBEBE5; --white:#FFFFFF; --line:#C9C9C1;
  --ultra:#1D34B4; --ultra-lo:#E4E7F7;
  --surik:#D63410; --surik-lo:#FAE2DC;
  --ochre:#C98209; --ochre-dk:#8A5A05; --ochre-lo:#F8EBD2;
  --pine:#0F7350; --pine-lo:#DCEFE6;
  --gut:22px;
  --band:6px;
  --ff-d:"Oswald","Arial Narrow",sans-serif;
  --ff:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  --ez:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ff);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--ff-d);font-weight:600;text-transform:uppercase;line-height:.98;letter-spacing:.005em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
svg{display:block}
::selection{background:var(--surik);color:#fff}
::-moz-selection{background:var(--surik);color:#fff}
:focus{outline:none}
:focus-visible{outline:3px solid var(--surik);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--surik)}

/* ---------- поля ---------- */
input,select,textarea{font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--white);
  border:2px solid var(--ink);border-radius:0;padding:9px 11px;outline:none;width:100%;caret-color:var(--surik)}
input:hover,select:hover,textarea:hover{border-color:var(--ultra)}
input:focus,select:focus,textarea:focus{border-color:var(--surik);box-shadow:inset 0 -4px 0 var(--surik)}
input:disabled,select:disabled{background:var(--paper);color:var(--ink-3);border-color:var(--line);cursor:not-allowed}
input::placeholder{color:var(--ink-3)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--ink) 50%),linear-gradient(-45deg,transparent 49%,var(--ink) 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 9px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:6px}
.frow{margin-bottom:15px}

/* ---------- коммутатор ролей ---------- */
#comm{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff}
.comm-in{max-width:1240px;margin:0 auto;display:flex;align-items:stretch;gap:0;padding:0 clamp(14px,3vw,26px);flex-wrap:wrap}
.comm-lbl{font-family:var(--ff-d);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#8D939E;
  display:flex;align-items:center;padding:11px 16px 11px 0;white-space:nowrap}
.jack{position:relative;padding:11px 13px 12px;font-size:12.5px;font-weight:600;color:#C7CBD2;
  display:flex;align-items:center;gap:8px;transition:color .16s,background .16s}
.jack .n{font-family:var(--ff-d);font-size:11px;color:#6E7480;letter-spacing:.04em}
.jack:hover{color:#fff;background:#22252B}
.jack.on{background:var(--surik);color:#fff}
.jack.on .n{color:#F6C9BE}
.jack.on::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--surik)}
.comm-sp{flex:1;min-width:0}

/* ---------- шапка продукта ---------- */
#hdr{position:sticky;top:44px;z-index:50;background:var(--white);border-bottom:2px solid var(--ink)}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:clamp(12px,2vw,26px);padding:12px clamp(14px,3vw,26px)}
.mark{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark .box{width:34px;height:34px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.mark b{font-family:var(--ff-d);font-size:21px;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1}
.mark span{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3)}
.hdr-nav{display:flex;gap:0;flex-wrap:wrap}
.hdr-nav button{font-family:var(--ff-d);font-size:14px;text-transform:uppercase;letter-spacing:.04em;
  padding:8px 13px;color:var(--ink-2);border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
.hdr-nav button:hover{color:var(--ink);border-bottom-color:var(--line)}
.hdr-nav button.on{color:var(--ink);border-bottom-color:var(--surik)}
.hdr-sp{flex:1;min-width:0}
.who{font-size:12px;text-align:right;line-height:1.3;white-space:nowrap}
.who b{display:block;font-size:13.5px}
.who span{color:var(--ink-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em;font-weight:700}
.bell{position:relative;width:38px;height:38px;border:2px solid var(--ink);background:var(--white);
  display:grid;place-items:center;transition:background .15s,color .15s}
.bell:hover{background:var(--ink);color:#fff}
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;background:var(--surik);color:#fff;
  font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--white)}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surik);color:#fff;
  font-weight:700;font-size:14px;padding:11px 20px;border:2px solid var(--surik);text-transform:uppercase;
  letter-spacing:.05em;transition:background .15s,color .15s,border-color .15s;min-height:44px}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn.big{font-family:var(--ff-d);font-size:17px;padding:15px 28px;letter-spacing:.06em;min-height:54px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink)}
.btn.dark:hover{background:var(--surik);border-color:var(--surik)}
.btn.ok{background:var(--pine);border-color:var(--pine)}
.btn.ok:hover{background:var(--ink);border-color:var(--ink)}
.btn.sm{font-size:12px;padding:7px 12px;min-height:36px;letter-spacing:.04em}
.btn[disabled]{background:var(--paper);color:var(--ink-3);border-color:var(--line);cursor:not-allowed}
.btn[disabled]:hover{background:var(--paper);color:var(--ink-3);border-color:var(--line)}

/* ---------- каркас ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,30px) clamp(14px,3vw,26px) 80px}
.grid{display:grid;gap:var(--gut)}
.plate{background:var(--white);border:2px solid var(--ink)}
.plate>.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 15px;
  background:var(--ink);color:#fff}
.plate>.hd h3{font-size:16px;letter-spacing:.03em}
.plate>.hd .hint{color:#A8AEB8}
.plate>.bd{padding:16px 15px}
.hint{color:var(--ink-3);font-size:12.5px;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv>span:first-child{color:var(--ink-2)}
.kv b{font-weight:700;text-align:right}

/* ---------- ярлыки состояний ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;border:2px solid;white-space:nowrap}
.tag.free{background:var(--white);color:var(--ink);border-color:var(--ink)}
.tag.busy{background:var(--ultra);color:#fff;border-color:var(--ultra)}
.tag.clean{background:var(--ochre);color:var(--ink);border-color:var(--ochre)}
.tag.fix{background:var(--surik);color:#fff;border-color:var(--surik)}
.tag.gray{background:var(--paper);color:var(--ink-2);border-color:var(--line)}
.tag.ok{background:var(--pine);color:#fff;border-color:var(--pine)}

/* ---------- таблицы ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-family:var(--ff-d);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;
  text-align:left;padding:9px 10px;background:var(--ink);color:#fff;white-space:nowrap;position:sticky;top:0}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:var(--ultra-lo)}
.num{text-align:right;font-weight:700}
.tscroll{overflow-x:auto}

/* ---------- лендинг ---------- */
.hero{max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,52px) clamp(14px,3vw,26px) 0;
  display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,3vw,40px);align-items:start}
.hero h1{font-size:clamp(38px,5.6vw,74px);font-weight:700;letter-spacing:-.008em}
.hero h1 em{font-style:normal;background:var(--surik);color:#fff;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero h1 u{text-decoration:none;background:var(--ink);color:#fff;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{font-size:clamp(15px,1.35vw,17.5px);color:var(--ink-2);margin:20px 0 24px;max-width:56ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:4px solid var(--ink);border-bottom:2px solid var(--ink)}
.facts div{padding:13px 14px 14px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:none}
.facts b{font-family:var(--ff-d);font-size:clamp(22px,2.4vw,31px);display:block;line-height:1;margin-bottom:5px}
.facts span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.ribbon{max-width:1240px;margin:clamp(22px,3vw,38px) auto 0;padding:0 clamp(14px,3vw,26px);overflow:hidden}
.ribbon-in{background:var(--ink);color:#fff;transform:rotate(-1.15deg);display:grid;
  grid-template-columns:repeat(4,1fr);font-family:var(--ff-d);text-transform:uppercase}
.ribbon-in span{padding:14px 18px;border-right:1px solid #3A3F47;font-size:clamp(12px,1.25vw,16px);
  letter-spacing:.09em;line-height:1.2;display:flex;align-items:center}
.ribbon-in span:last-child{border-right:none}
.ribbon-in b{color:var(--surik);font-weight:600}
@media(max-width:820px){.ribbon-in{grid-template-columns:1fr 1fr}
  .ribbon-in span:nth-child(2){border-right:none}
  .ribbon-in span:nth-child(-n+2){border-bottom:1px solid #3A3F47}}
.sect{max-width:1240px;margin:0 auto;padding:clamp(34px,5vw,64px) clamp(14px,3vw,26px) 0}
.sect>h2{font-size:clamp(26px,3.4vw,42px);font-weight:700;margin-bottom:22px}
.manifest{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.manifest p{font-size:clamp(16px,1.5vw,19px);line-height:1.5;max-width:62ch}
.manifest p+p{margin-top:15px;font-size:15px;color:var(--ink-2)}
.dl{border-top:4px solid var(--ink)}
.dl>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dl dt{color:var(--ink-2)}
.dl dd{font-weight:700;text-align:right}
.ladder{border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)}
.ladder>div{display:grid;grid-template-columns:78px minmax(0,1fr) minmax(0,1.5fr);gap:clamp(12px,2vw,26px);
  align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.ladder>div:last-child{border-bottom:none}
.ladder .n{font-family:var(--ff-d);font-size:clamp(34px,4vw,54px);line-height:.8;color:var(--surik)}
.ladder h3{font-size:clamp(17px,1.7vw,21px)}
.ladder p{font-size:14px;color:var(--ink-2);max-width:58ch}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px}
.ledger th{font-family:var(--ff-d);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:500;
  text-align:left;padding:10px 12px;background:var(--ink);color:#fff}
.ledger td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ledger td:first-child{font-weight:700;width:32%}
.ledger tr:last-child td{border-bottom:2px solid var(--ink)}
footer{background:var(--ink);color:#fff;margin-top:clamp(40px,6vw,80px)}
.foot{max-width:1240px;margin:0 auto;padding:30px clamp(14px,3vw,26px);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;font-size:13px;color:#A8AEB8}
.foot b{color:#fff;font-family:var(--ff-d);font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:7px}
.foot a{color:#fff}
</style>
<style>
/* ---------- карта ---------- */
.mapbox{position:relative;border:2px solid var(--ink);background:var(--ultra);overflow:hidden}
.mapbox svg{width:100%;height:auto}
.mk{cursor:pointer}
.mk rect.pill{fill:var(--surik)}
.mk text{font-family:var(--ff-d);font-size:13px;fill:#fff;letter-spacing:.03em}
.mk circle{fill:#fff;stroke:var(--ink);stroke-width:2}
.mk.busy rect.pill{fill:#5D6580}
.mk.busy circle{fill:#5D6580;stroke:#3E465C}
.mk.sel rect.pill{fill:var(--white)}
.mk.sel text{fill:var(--ink)}
.mk:hover rect.pill{fill:var(--ink)}
.mk:hover text{fill:#fff}
.legend{display:flex;gap:0;border-top:2px solid var(--ink);background:var(--white);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;padding:9px 12px;border-right:1px solid var(--line);color:var(--ink-2)}
.legend i{width:11px;height:11px;flex-shrink:0}

/* ---------- квартиры ---------- */
.aptlist{display:grid;gap:14px}
.apt{display:grid;grid-template-columns:158px minmax(0,1fr) auto;gap:16px;padding:14px;
  background:var(--white);border:2px solid var(--ink);cursor:pointer;align-items:center;
  transition:background .15s,border-color .15s}
.apt:hover{background:var(--ultra-lo)}
.apt.sel{border-color:var(--surik);box-shadow:inset 0 0 0 3px var(--surik-lo)}
.apt.off{opacity:.6}
.plan{width:100%;aspect-ratio:200/140;background:var(--paper);border:2px solid var(--ink)}
.apt h4{font-size:19px;margin-bottom:5px}
.apt .meta{font-size:12.5px;color:var(--ink-2)}
.apt .dst{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ultra);margin-bottom:6px}
.apt .price{text-align:right;white-space:nowrap}
.apt .price b{font-family:var(--ff-d);font-size:27px;display:block;line-height:1}
.apt .price span{font-size:11.5px;color:var(--ink-3);display:block;margin:3px 0 9px}

/* ---------- пульт состояния ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.bcard{background:var(--white);border:2px solid var(--ink);display:flex;flex-direction:column}
.bcard .strip{height:var(--band);background:var(--ink);transition:background .2s}
.bcard.free .strip{background:var(--ink)}
.bcard.busy .strip{background:var(--ultra)}
.bcard.clean .strip{background:var(--ochre)}
.bcard.fix .strip{background:var(--surik)}
.bcard .in{padding:13px 14px 15px;display:flex;flex-direction:column;gap:8px;height:100%}
.bcard h4{font-size:17px}
.bcard .dst{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.bcard .st{font-size:13.5px;margin-top:2px}
.bcard .sub{font-size:12px;color:var(--ink-2);margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}

/* ---------- шахматка ---------- */
.chess{overflow:auto;max-height:62vh}
.chess table{border-collapse:collapse;font-size:12px;min-width:760px;width:100%}
.chess th,.chess td{border:1px solid var(--line);padding:6px 4px;text-align:center;white-space:nowrap;height:38px}
.chess thead th{background:var(--ink);color:#fff;font-family:var(--ff-d);font-weight:400;letter-spacing:.05em;
  font-size:11px;position:sticky;top:0;z-index:2;border-color:#33373F}
.chess thead th.wknd{background:#33373F}
.chess td.b{background:var(--ultra);color:#fff;font-weight:700;border-color:var(--ultra)}
.chess td.p{background:var(--ochre);color:var(--ink);font-weight:700;border-color:var(--ochre)}
.chess td.r{background:var(--surik);color:#fff;font-weight:700;border-color:var(--surik)}
.chess th.rowh,.chess td.rowh{text-align:left;position:sticky;left:0;background:var(--white);z-index:1;
  font-weight:700;min-width:200px;border-right:2px solid var(--ink)}
.chess thead th.rowh{background:var(--ink);color:#fff;z-index:3}
.chess td.rowh small{display:block;font-weight:600;color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}

/* ---------- чат ---------- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding:4px 2px}
.msg{max-width:80%;padding:10px 13px;font-size:13.5px;border:2px solid var(--ink)}
.msg small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:5px;opacity:.7}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff}
.msg.them{align-self:flex-start;background:var(--white)}
.chat-in{display:flex;gap:10px;margin-top:12px}

/* ---------- уведомления ---------- */
#bellDrop{position:absolute;right:0;top:46px;width:min(360px,86vw);background:var(--white);border:2px solid var(--ink);
  z-index:70;max-height:400px;overflow:auto}
#bellDrop .n{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
#bellDrop .n:last-child{border-bottom:none}
#bellDrop .n small{color:var(--ink-3);display:block;margin-top:4px;font-weight:700;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.08em}
#bellDrop .n.unread{border-left:var(--band) solid var(--surik);padding-left:12px}

/* ---------- модалки, тосты ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
  background:rgba(20,22,26,.72);overflow:auto;padding:clamp(16px,5vh,60px) 16px}
#modal-root.open{display:flex}
.modal{background:var(--white);border:2px solid var(--ink);max-width:580px;width:100%;margin-bottom:60px;
  animation:mIn .3s var(--ez)}
@keyframes mIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.modal .m-hd{padding:13px 18px;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:space-between;gap:14px}
.modal .m-hd h3{font-size:17px;letter-spacing:.03em}
.modal .m-bd{padding:20px 18px}
.x{width:34px;height:34px;display:grid;place-items:center;color:#fff;flex-shrink:0;transition:background .15s}
.x:hover{background:var(--surik)}
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;
  flex-direction:column;gap:9px;align-items:center;width:min(560px,92vw)}
.toast{background:var(--ink);color:#fff;padding:13px 18px;font-size:13.5px;font-weight:600;width:100%;
  border-left:var(--band) solid var(--surik);animation:tin .32s var(--ez)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- оплата, документ ---------- */
.paybox{border:2px solid var(--ink);padding:16px;background:var(--paper)}
.paymeth{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:14px 0;border:2px solid var(--ink)}
.paymeth button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;font-weight:700;
  font-size:13px;background:var(--white);transition:background .15s,color .15s;min-height:48px}
.paymeth button+button{border-left:2px solid var(--ink)}
.paymeth button.on{background:var(--ink);color:#fff}
.docv{border:2px solid var(--ink);padding:22px;background:var(--white)}
.docv h4{font-size:19px;margin-bottom:6px}
.docv .sep{border-top:2px solid var(--ink);margin:14px 0}
.stamp{display:inline-block;border:2px solid var(--surik);color:var(--surik);font-family:var(--ff-d);
  font-size:12px;letter-spacing:.13em;text-transform:uppercase;padding:5px 11px;transform:rotate(-3deg)}

/* ---------- смены ---------- */
.shiftgrid{display:grid;grid-template-columns:repeat(7,1fr);border:2px solid var(--ink)}
.shiftgrid .d{padding:10px;border-right:1px solid var(--line);min-width:0}
.shiftgrid .d:last-child{border-right:none}
.shiftgrid .d.wknd{background:var(--paper)}
.shiftgrid .d>b{display:block;font-family:var(--ff-d);font-size:13px;letter-spacing:.1em;margin-bottom:8px;color:var(--ink-2)}
.shiftgrid .d.today>b{color:var(--surik)}
.shiftgrid select{font-size:12.5px;padding:6px 22px 6px 7px;border-width:2px;background-position:calc(100% - 11px) 55%,calc(100% - 6px) 55%}
.shiftgrid .nm{font-size:13px;font-weight:700}
.routebar{display:flex;align-items:center;gap:14px;padding:15px 17px;background:var(--ink);color:#fff;flex-wrap:wrap}
.routebar.off{background:var(--surik)}
.routebar .pulse{width:13px;height:13px;background:#fff;flex-shrink:0;animation:blink 2.2s var(--ez) infinite}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.25}}
.routebar b{font-size:15px;display:block;line-height:1.35}
.routebar .sub{font-size:12.5px;color:#B9BFC9;margin-top:4px}
.routebar.off .sub{color:#F6C9BE}

/* ---------- сетки ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gut)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--gut);align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gut)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}
.empty{padding:26px 16px;text-align:center;border:2px dashed var(--line);color:var(--ink-3);font-size:13.5px}

/* ---------- лента появления ---------- */
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.wipe{animation:wipe .42s var(--ez) both}

@media(max-width:1000px){
  .hero{grid-template-columns:1fr}
  .manifest,.two,.split,.cols3{grid-template-columns:1fr}
  .apt{grid-template-columns:120px minmax(0,1fr)}
  .apt .price{grid-column:2;text-align:left;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .apt .price span{margin:0}
  .shiftgrid{grid-template-columns:repeat(4,1fr)}
  .shiftgrid .d{border-bottom:1px solid var(--line)}
  #hdr{position:static}
}
@media(max-width:640px){
  .comm-lbl{display:none}
  .facts{grid-template-columns:1fr;border-bottom-width:4px}
  .facts div{border-right:none;border-bottom:1px solid var(--line)}
  .facts div:last-child{border-bottom:none}
  .ladder>div{grid-template-columns:52px minmax(0,1fr);row-gap:6px}
  .ladder p{grid-column:2}
  .apt{grid-template-columns:1fr}
  .plan{max-width:200px}
  .ledger td:first-child{width:auto}
  .ledger,.ledger tbody,.ledger tr,.ledger td{display:block;width:100%}
  .ledger thead{display:none}
  .ledger tr{border-bottom:2px solid var(--ink);padding:6px 0}
  .ledger td{border-bottom:none;padding:5px 0}
  .shiftgrid{grid-template-columns:repeat(2,1fr)}
  .hdr-in{flex-wrap:wrap}
  .who{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

const overlap = (a1,a2,b1,b2)=> P(a1) < P(b2) && P(b1) < P(a2);
function isFree(aptId, from, to){
  if(DB.repairs.some(r=>r.apt===aptId && r.block && r.status!=='done')) return false;
  return !DB.bookings.some(b=>b.apt===aptId && (b.status==='paid'||b.status==='pending') && overlap(from,to,b.from,b.to));
}
function notify(to,text){ DB.notifs.unshift({to,text,t:nowT(),unread:true}); }
function chatPush(bid, from, name, text){ (DB.chats[bid]=DB.chats[bid]||[]).push({from,name,text,t:nowT()}); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toast-root').appendChild(t);
  setTimeout(()=>t.remove(),3600);
}

/* маршрутизация звонков */
function routeFor(dayIdx, time){
  const s=DB.settings;
  const inWork = time>=s.workFrom && time<s.workTo;
  const mid = s.days[dayIdx];
  if(inWork && mid) return {who:DB.users[mid].name, role:'менеджер', phone:DB.users[mid].phone, work:true, mid};
  return {who:DB.users.admin.name, role:'администратор', phone:DB.users.admin.phone, work:false, mid:null};
}

function aptState(a){
  const rep=DB.repairs.find(r=>r.apt===a.id && r.status!=='done');
  if(rep) return {cls:'fix', tag:'<span class="tag fix">Ремонт</span>', line:rep.desc,
    sub:'Исполнитель: '+(rep.by?DB.users[rep.by].name:'не назначен')};
  const act=DB.bookings.find(b=>b.apt===a.id && b.status==='paid' && P(b.from)<=TODAY && P(b.to)>TODAY);
  if(act) return {cls:'busy', tag:'<span class="tag busy">Занята</span>', line:'Гость: '+esc(clientName(act)),
    sub:'Выезд '+fmtD(act.to)+' до 12:00 · бронь №'+act.id};
  const ct=DB.cleanTasks.find(t=>t.apt===a.id && t.status!=='done');
  if(ct){
    const seen = ct.status==='new' ? 'уборщица ещё не приняла задачу'
      : ct.status==='seen' ? 'приняла: '+DB.users[ct.by].name
      : 'убирает: '+DB.users[ct.by].name;
    return {cls:'clean', tag:'<span class="tag clean">Ждёт уборки</span>', line:ct.type+' · '+ct.due, sub:seen};
  }
  const next=DB.bookings.filter(b=>b.apt===a.id && b.status==='paid' && P(b.from)>TODAY)
    .sort((x,y)=>P(x.from)-P(y.from))[0];
  return {cls:'free', tag:'<span class="tag free">Свободна</span>', line:'Готова к заселению',
    sub:next?('Ближайший заезд '+fmtD(next.from)):'Броней нет'};
}

function vClient(){
  if(S.clientTab==='my') return cMy();
  if(S.clientTab==='docs') return cDocs();
  return cSearch();
}
function doSearch(){
  const f=document.getElementById('sf').value, t=document.getElementById('st').value,
        d=document.getElementById('sd').value;
  if(!f||!t){ toast('Укажите обе даты — заезд и выезд'); return; }
  if(P(t)<=P(f)){ toast('Дата выезда должна быть позже даты заезда'); return; }
  S.search={from:f,to:t,district:d}; S.selApt=null; render();
}
function selectApt(id){
  S.selApt = S.selApt===id?null:id; render();
  const el=document.getElementById('apt-'+id);
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function cSearch(){
  const {from,to,district}=S.search; const n=nights(from,to);
  const shown=DB.apartments.filter(a=>district==='all'||a.d===district);
  const free=shown.filter(a=>isFree(a.id,from,to));
  const list = shown.length ? shown.map(a=>{
    const ok=isFree(a.id,from,to);
    return `<article class="apt ${S.selApt===a.id?'sel':''} ${ok?'':'off'}" id="apt-${a.id}"
      onclick="selectApt(${a.id})" tabindex="0" role="button" aria-pressed="${S.selApt===a.id}"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectApt(${a.id})}">

      <div>
        <span class="dst">${ic('pin',13)}${esc(a.d)}</span>
        <h4>${esc(a.addr)}</h4>
        <div class="meta">${esc(a.rooms)} · до ${a.sleeps} гостей · залог ${RUB(a.dep)}</div>
        <div class="mt">${ok?'<span class="tag ok">Свободна на ваши даты</span>'
          :'<span class="tag gray">Занята на эти даты</span>'}</div>
      </div>
      <div class="price">
        <b>${RUB(a.price)}</b>
        <span>за сутки · ${RUB(a.price*n)} за ${n} ${nightWord(n)}</span>
        <button class="btn sm" ${ok?'':'disabled'}
          onclick="event.stopPropagation();openBooking(${a.id})">Забронировать</button>
      </div>
    </article>`;
  }).join('') : `<div class="empty">В районе «${esc(district)}» квартир нет. Выберите другой район или «Все районы».</div>`;

  return `<div class="wrap">
    <form class="plate" style="margin-bottom:var(--gut)" onsubmit="event.preventDefault();doSearch()">
      <div class="hd"><h3>Подбор квартиры</h3>
        <span class="hint">${free.length} из ${shown.length} свободно на ${fmtD(from)}—${fmtD(to)}</span></div>
      <div class="bd" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;align-items:end">
        <div class="frow" style="margin:0"><label for="sc">Город</label>
          <select id="sc" disabled><option>Екатеринбург</option></select></div>
        <div class="frow" style="margin:0"><label for="sd">Район</label>
          <select id="sd">
            <option value="all" ${district==='all'?'selected':''}>Все районы</option>
            ${Object.keys(DISTRICTS).map(d=>`<option value="${d}" ${district===d?'selected':''}>${d}</option>`).join('')}
          </select></div>
        <div class="frow" style="margin:0"><label for="sf">Заезд</label>
          <input type="date" id="sf" value="${from}" min="${iso(TODAY)}"></div>
        <div class="frow" style="margin:0"><label for="st">Выезд</label>

      </div>

  <div class="m-bd">

      <div style="width:132px;flex-shrink:0">${planSVG(a)}</div>
      <div><span class="dst" style="color:var(--ultra);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em">${esc(a.d)}</span>
        <h3 style="font-size:20px;margin:4px 0 5px">${esc(a.addr)}</h3>
        <div class="hint">${esc(a.rooms)} · до ${a.sleeps} гостей</div></div>
    </div>
    <div class="kv"><span>Даты</span><b>${fmtD(from)} — ${fmtD(to)} · ${n} ${nightWord(n)}</b></div>

    <div class="kv"><span>Возвратный залог</span><b>${RUB(a.dep)}</b></div>

      <span><b>К оплате сейчас</b></span><b style="font-family:var(--ff-d);font-size:26px">${RUB(total)}</b></div>
    <p class="hint" style="margin:10px 0 16px">Залог возвращается тем же способом оплаты после проверки

    <button class="btn big" style="width:100%"

let payCb=null;
function openPay(amount,title,cb){ payCb=cb; S.payMethod='card'; modal(payHTML(amount,title)); }
function setPayMethod(m){
  S.payMethod=m;

}

          onclick="setPayMethod('card')">${ic('card',18)}Банковская карта</button>

function payDone(amount){
  closeModal();
  toast('Платёж '+RUB(amount)+' проведён (демонстрация), чек отправлен на почту');
  if(payCb){ const cb=payCb; payCb=null; cb(); }
}
function finishBooking(aptId){
  const a=apt(aptId); const {from,to}=S.search; const n=nights(from,to);
  const sum=a.price*n+a.dep; const id=DB.seq.booking++;
  DB.bookings.push({id, apt:aptId, from, to, client:'cli', status:'paid',
    dep:{amount:a.dep,status:'held',deductions:[],surcharges:[]}});
  DB.payments.unshift({id:DB.seq.pay++, d:fmtDY(iso(TODAY)), type:'Оплата брони №'+id, amount:sum,
    method:(S.payMethod==='sbp'?'СБП':'Карта')+' · ЮKassa', dir:'+'});
  DB.docs.unshift({id:DB.seq.doc++, booking:id, type:'Чек',
    title:'Кассовый чек · оплата брони №'+id, d:fmtDY(iso(TODAY)), sum});
  DB.cleanTasks.push({id:DB.seq.task++, apt:aptId, type:'Подготовка к заезду',
    due:fmtD(from)+' до 13:00', status:'new', by:null, seenAt:null, doneAt:null, photos:0, booking:id});
  chatPush(id,'staff','Система','Бронь №'+id+' оплачена. Код от кейбокса и инструкция заселения придут сюда в день заезда до 13:00.');
  notify('manager','Новая онлайн-бронь №'+id+' · '+a.addr+' · '+fmtD(from)+'–'+fmtD(to));
  notify('admin','Оплачена бронь №'+id+' · '+RUB(sum)+' через ЮKassa');
  notify('cleaner','Новая задача: подготовка к заезду — '+a.addr+', '+fmtD(from));
  S.clientTab='my'; render();
  toast('Бронь №'+id+' подтверждена, задача уборки поставлена');
}

function bookingStatus(b){
  if(b.status==='pending') return '<span class="tag clean">Ожидает оплаты</span>';
  if(b.status==='done') return '<span class="tag gray">Завершена</span>';
  if(P(b.to)<=TODAY) return '<span class="tag clean">Выезд сегодня до 12:00</span>';
  if(P(b.from)<=TODAY) return '<span class="tag busy">Проживание · выезд '+fmtD(b.to)+'</span>';
  return '<span class="tag ok">Оплачена · заезд '+fmtD(b.from)+'</span>';
}
function depBlock(b,isClient){
  const d=b.dep;
  const ded=d.deductions.map(x=>`<div class="kv"><span>Удержано: ${esc(x.reason)}</span>
    <b style="color:var(--surik)">− ${RUB(x.sum)}</b></div>`).join('');
  const sur=d.surcharges.map((x,i)=>`<div class="kv"><span>Доначислено: ${esc(x.reason)}</span>
    <b style="color:var(--surik)">${RUB(x.sum)}${x.paid?' · оплачено':''}</b></div>
    ${(!x.paid&&isClient)?`<div class="mt"><button class="btn sm"
      onclick="openPay(${x.sum},'Доначисление по брони №${b.id}',()=>paySurcharge(${b.id},${i}))">
      Оплатить ${RUB(x.sum)}</button></div>`:''}`).join('');
  const st = d.status==='returned'?'<span class="tag ok">Возвращён</span>'
    : d.status==='partial'?'<span class="tag clean">Возвращён частично</span>'
    : d.status==='none'?'<span class="tag gray">Оплачивается при брони</span>'
    : '<span class="tag busy">Удержан до выезда</span>';
  return `<div style="border-top:2px solid var(--ink);margin-top:13px;padding-top:11px">
    <div class="kv"><span>${ic('shield',15)} Залог ${RUB(d.amount)}</span>${st}</div>${ded}${sur}</div>`;
}
function paySurcharge(bid,i){
  const b=bk(bid); const sc=b.dep.surcharges[i]; sc.paid=true;
  DB.payments.unshift({id:DB.seq.pay++, d:fmtDY(iso(TODAY)), type:'Доначисление по брони №'+bid,
    amount:sc.sum, method:'Карта · ЮKassa', dir:'+'});
  DB.docs.unshift({id:DB.seq.doc++, booking:bid, type:'Чек',
    title:'Кассовый чек · доначисление по брони №'+bid, d:fmtDY(iso(TODAY)), sum:sc.sum});
  chatPush(bid,'client','Дмитрий','Оплатил доначисление '+RUB(sc.sum)+'.');
  notify('admin','Клиент оплатил доначисление по брони №'+bid+' · '+RUB(sc.sum));
  render(); toast('Доначисление оплачено, чек в документах');
}

function openChatModal(bid){
  const b=bk(bid); const a=apt(b.apt); const msgs=DB.chats[bid]||[];
  const isStaff=S.role!=='client';
  modal(`<div class="m-hd"><h3>Бронь №${bid} · ${esc(a.addr)}</h3>

      const me=(isStaff&&m.from==='staff')||(!isStaff&&m.from==='client');
      return `<div class="msg ${me?'me':'them'}">${esc(m.text)}<small>${esc(m.name)} · ${esc(m.t)}</small></div>`;
    }).join(''):'<div class="empty">Сообщений пока нет</div>'}</div>
    <form class="chat-in" onsubmit="event.preventDefault();sendChat(${bid})">

function sendChat(bid){
  const inp=document.getElementById('chatTxt'); const txt=inp.value.trim(); if(!txt) return;
  const isStaff=S.role!=='client';
  const name=isStaff?({manager:'Марина · менеджер',admin:'Артём · администратор',
    cleaner:'Тамара · уборщица',repair:'Виктор · ремонтник'}[S.role]||'Сотрудник'):'Дмитрий';
  chatPush(bid, isStaff?'staff':'client', name, txt);
  notify(isStaff?'client':'manager','Новое сообщение в чате брони №'+bid);
  openChatModal(bid); renderHeader();
}

function mgrBookingApply(){
  const aid=+document.getElementById('nbA').value;
  const f=document.getElementById('nbF').value, t=document.getElementById('nbT').value;
  const g=document.getElementById('nbG').value.trim();
  if(!f||!t||P(t)<=P(f)){ toast('Дата выезда должна быть позже даты заезда'); return; }
  if(!isFree(aid,f,t)){ toast('Квартира занята на эти даты — выберите другую'); return; }
  const id=DB.seq.booking++;
  DB.bookings.push({id, apt:aid, from:f, to:t, client:null, guest:g||'Гость', status:'pending',
    dep:{amount:apt(aid).dep,status:'none',deductions:[],surcharges:[]}});
  notify('admin','Менеджер создал бронь №'+id+' — ожидает оплаты');
  closeModal(); S.managerTab='req'; render();

function markPaid(bid){
  const b=bk(bid); b.status='paid'; b.dep.status='held';
  const a=apt(b.apt); const sum=a.price*nights(b.from,b.to)+a.dep;
  DB.payments.unshift({id:DB.seq.pay++, d:fmtDY(iso(TODAY)), type:'Оплата брони №'+bid,
    amount:sum, method:'СБП · ЮKassa', dir:'+'});
  DB.docs.unshift({id:DB.seq.doc++, booking:bid, type:'Чек',
    title:'Кассовый чек · оплата брони №'+bid, d:fmtDY(iso(TODAY)), sum});
  DB.cleanTasks.push({id:DB.seq.task++, apt:b.apt, type:'Подготовка к заезду',
    due:fmtD(b.from)+' до 13:00', status:'new', by:null, seenAt:null, doneAt:null, photos:0, booking:bid});
  notify('cleaner','Новая задача: подготовка к заезду — '+a.addr+', '+fmtD(b.from));
  notify('admin','Оплачена бронь №'+bid+' · '+RUB(sum));
  render(); toast('Оплата по брони №'+bid+' получена, задача уборки поставлена');
}

function depReturn(bid){
  const b=bk(bid);
  const rest=b.dep.amount - b.dep.deductions.reduce((s,x)=>s+x.sum,0);
  b.dep.status = b.dep.deductions.length ? 'partial' : 'returned';
  DB.payments.unshift({id:DB.seq.pay++, d:fmtDY(iso(TODAY)), type:'Возврат залога №'+bid,
    amount:rest, method:'ЮKassa · возврат', dir:'−'});
  DB.docs.unshift({id:DB.seq.doc++, booking:bid, type:'Чек',
    title:'Чек возврата · залог по брони №'+bid, d:fmtDY(iso(TODAY)), sum:rest});
  if(b.client){
    notify('client','Залог по брони №'+bid+' возвращён: '+RUB(rest)+'. Чек — в документах.');
    chatPush(bid,'staff','Артём · администратор','Залог '+RUB(rest)+' возвращён на ваш способ оплаты. Спасибо, что выбрали нас!');
  }
  render(); toast('Возврат '+RUB(rest)+' проведён через ЮKassa (демонстрация)');
}
function depDeductForm(bid){
  const b=bk(bid);
  const left=b.dep.amount - b.dep.deductions.reduce((s,x)=>s+x.sum,0);
  modal(`<div class="m-hd"><h3>Удержание из залога · бронь №${bid}</h3>
    <button class="x" onclick="closeModal()" aria-label="Закрыть">${ic('close',18)}</button></div>
  <div class="m-bd"><form onsubmit="event.preventDefault();depDeductApply(${bid})">

    <div class="frow mt"><label for="ddS">Сумма удержания, ₽</label>
      <input type="number" id="ddS" value="${Math.min(1500,left)}" min="1" max="${left}" step="100"></div>
    <div class="frow"><label for="ddR">Причина — её увидит клиент</label>

function depDeductApply(bid){
  const b=bk(bid);
  const left=b.dep.amount - b.dep.deductions.reduce((s,x)=>s+x.sum,0);
  const s=+document.getElementById('ddS').value||0;
  const r=document.getElementById('ddR').value.trim()||'без указания причины';
  if(s<=0){ toast('Сумма удержания должна быть больше нуля'); return; }
  if(s>left){ toast('Больше остатка залога удержать нельзя — есть ' + RUB(left) + ', для превышения используйте доначисление'); return; }
  b.dep.deductions.push({sum:s,reason:r,date:fmtDY(iso(TODAY))});
  DB.docs.unshift({id:DB.seq.doc++, booking:bid, type:'Акт',
    title:'Акт удержания из залога · бронь №'+bid, d:fmtDY(iso(TODAY)), sum:s});
  if(b.client){
    notify('client','Из залога по брони №'+bid+' удержано '+RUB(s)+': '+r+'. Подробности в чате.');
    chatPush(bid,'staff','Артём · администратор','Из залога удержано '+RUB(s)+'. Причина: '+r+
      '. Акт с фотографиями — в разделе «Документы». Если не согласны, обсудим здесь.');
  }
  closeModal(); render(); toast('Удержание оформлено, клиент уведомлён');
}

/* ============ МОДАЛКИ ============ */
let lastFocus=null;
function modal(html){
  lastFocus=document.activeElement;
  const r=document.getElementById('modal-root');
  r.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  r.classList.add('open');
  document.body.style.overflow='hidden';
  const f=r.querySelector('input:not([disabled]),select,textarea,button');
  if(f) setTimeout(()=>f.focus(),40);
}
function closeModal(){
  const r=document.getElementById('modal-root');
  if(!r.classList.contains('open')) return;
  r.classList.remove('open'); r.innerHTML=''; document.body.style.overflow='';
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('modal-root').classList.contains('open')) closeModal();
    else if(S.bellOpen){ bellToggle(); }
  }
});
document.addEventListener('click',e=>{
  if(S.bellOpen && !e.target.closest('#bellDrop') && !e.target.closest('.bell')) bellToggle();
});

render();
</script>
